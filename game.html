<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman Game</title>
<style>
  :root {
    --bg: #f0f2f5;
    --text: #1c1c1c;
    --accent: #0a2342;      /* deep royal navy */
    --highlight: #cda434;   /* gold accent */
    --card: #ffffff;
    --border: #ddd;
  }
  body.dark {
    --bg: #0a0f18;
    --text: #e9e9e9;
    --accent: #5fa8d3;
    --highlight: #e0b94d;
    --card: #121826;
    --border: #333;
  }

  body {
    background: var(--bg);
    font-family: 'Times New Roman', serif;
    color: var(--text);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  .container {
    background: var(--card);
    border-radius: 14px;
    padding: 40px 50px;
    width: 500px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    border: 1px solid var(--border);
    text-align: center;
    transition: background 0.3s, box-shadow 0.3s;
  }

  h1 {
    color: var(--highlight);
    font-size: 32px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  h2 {
    color: var(--accent);
    font-weight: normal;
    margin-top: 0;
    font-size: 16px;
    letter-spacing: 0.5px;
  }

  select, input, button {
    font-family: 'Times New Roman', serif;
    font-size: 16px;
    padding: 8px 12px;
    margin: 8px 4px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    transition: all 0.3s ease;
  }

  button {
    background-color: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  #hangman {
    white-space: pre;
    font-family: monospace;
    font-size: 15px;
    color: var(--text);
    margin-top: 20px;
  }

  #word {
    font-size: 24px;
    letter-spacing: 6px;
    margin: 20px 0;
  }

  #message {
    margin-top: 10px;
    font-weight: bold;
    color: var(--accent);
  }

  #wrong {
    color: #a94442;
  }

  #replay, #themeToggle {
    margin-top: 15px;
  }

  .counter {
    font-size: 15px;
    opacity: 0.8;
    margin-bottom: 15px;
  }

  footer {
    margin-top: 25px;
    font-size: 14px;
    opacity: 0.75;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: bold;
  }

  footer a:hover {
    color: var(--highlight);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Hangman</h1>
    <h2>Classic Word Guessing Game</h2>
    <button id="themeToggle">Dark Mode</button>

    <div class="counter">
      Games Played: <span id="playCount">0</span>
    </div>

    <div id="menu">
      <label for="category">Category:</label>
      <select id="category">
        <option value="animals">Animals</option>
        <option value="countries">Countries</option>
        <option value="programming">Programming</option>
        <option value="science">Science</option>
        <option value="all">All</option>
      </select>
      <button id="start">Start</button>
    </div>

    <div id="game" style="display:none;">
      <pre id="hangman"></pre>
      <p id="word"></p>
      <p>Wrong guesses: <span id="wrong">(none)</span></p>
      <p>Attempts left: <span id="attempts">6</span></p>
      <input type="text" id="guess" placeholder="Enter letter(s) or word" maxlength="20">
      <button id="guessBtn">Guess</button>
      <p id="message"></p>
      <button id="replay">Play Again</button>
    </div>

    <footer>
      <p>Developed by <a href="https://github.com/sobanmujtaba/Hangman-game" target="_blank">Soban Mujtaba</a></p>
    </footer>
  </div>

<script>
const words = {
  animals: ["elephant", "tiger", "lion", "zebra", "giraffe", "panda"],
  countries: ["pakistan", "canada", "brazil", "germany", "nepal", "egypt"],
  programming: ["python", "java", "haskell", "kotlin", "ruby", "swift"],
  science: ["atom", "neutron", "gravity", "energy", "molecule", "quantum"]
};

const stages = [
`+---+
|   |
    |
    |
    |
    |
=========`,
`+---+
|   |
O   |
    |
    |
    |
=========`,
`+---+
|   |
O   |
|   |
    |
    |
=========`,
`+---+
|   |
O   |
/|   |
    |
    |
=========`,
`+---+
|   |
O   |
/|\\  |
    |
    |
=========`,
`+---+
|   |
O   |
/|\\  |
/    |
    |
=========`,
`+---+
|   |
O   |
/|\\  |
/ \\  |
=========`];

let word = "", display = [], wrong = [], attempts = 6;
let playCount = parseInt(localStorage.getItem("playCount")) || 0;
document.getElementById("playCount").textContent = playCount;

// Theme toggle
const themeToggle = document.getElementById("themeToggle");
if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
themeToggle.textContent = document.body.classList.contains("dark") ? "Light Mode" : "Dark Mode";
themeToggle.onclick = () => {
  document.body.classList.toggle("dark");
  const theme = document.body.classList.contains("dark") ? "dark" : "light";
  localStorage.setItem("theme", theme);
  themeToggle.textContent = theme === "dark" ? "Light Mode" : "Dark Mode";
};

// Listeners
document.getElementById("start").onclick = startGame;
document.getElementById("guessBtn").onclick = makeGuess;
document.getElementById("replay").onclick = resetGame;
document.getElementById("guess").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    makeGuess();
  }
});

function startGame() {
  const cat = document.getElementById("category").value;
  const list = cat === "all" ? Object.values(words).flat() : words[cat];
  word = list[Math.floor(Math.random() * list.length)];
  display = Array(word.length).fill("_");
  wrong = [];
  attempts = 6;
  playCount++;
  localStorage.setItem("playCount", playCount);
  document.getElementById("playCount").textContent = playCount;

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";
  document.getElementById("guessBtn").disabled = false;
  document.getElementById("replay").style.display = "none";
  document.getElementById("message").textContent = "Game started. Good luck.";
  updateUI();
}

function makeGuess() {
  const input = document.getElementById("guess").value.toLowerCase().trim();
  document.getElementById("guess").value = "";
  if (!input) return;

  if (input === word) {
    display = word.split("");
    return win();
  }

  let correct = false;
  for (const ch of input) {
    if (word.includes(ch)) {
      for (let i = 0; i < word.length; i++) {
        if (word[i] === ch) display[i] = ch;
      }
      correct = true;
    } else if (!wrong.includes(ch)) {
      wrong.push(ch);
      attempts--;
    }
  }

  if (!display.includes("_")) return win();
  if (attempts <= 0) return lose();
  updateUI(correct ? "Correct guess." : "Wrong guess.");
}

function updateUI(msg="") {
  document.getElementById("word").textContent = display.join(" ");
  document.getElementById("wrong").textContent = wrong.join(", ") || "(none)";
  document.getElementById("attempts").textContent = attempts;
  document.getElementById("hangman").textContent = stages[6 - attempts];
  document.getElementById("message").textContent = msg;
}

function win() {
  updateUI("You win! Word: " + word);
  endGame();
}

function lose() {
  updateUI("You lose! Word was: " + word);
  endGame();
}

function endGame() {
  document.getElementById("guessBtn").disabled = true;
  document.getElementById("replay").style.display = "inline-block";
}

function resetGame() {
  document.getElementById("game").style.display = "none";
  document.getElementById("menu").style.display = "block";
  document.getElementById("message").textContent = "";
  document.getElementById("guess").value = "";
}
</script>
</body>
</html>
